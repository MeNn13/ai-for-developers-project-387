name: implementation-completion

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: implementation-completion
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report trusted Actions outcome without model or artifacts
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PUBLISH_APP_BOT_ID: ${{ vars.PUBLISH_APP_BOT_ID }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { completion } = await import(pathToFileURL(path.resolve('scripts/implementation-completion.mjs')).href);
            for await (const response of github.paginate.iterator(github.rest.actions.listWorkflowRuns, { ...context.repo, workflow_id: 'opencode.yml', status: 'completed', per_page: 100 })) {
              for (const run of response.data) for (let attempt = 1; attempt <= run.run_attempt; attempt++) {
                const checked = (await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}', { ...context.repo, run_id: run.id, attempt_number: attempt })).data;
                await completion(checked, async (method, route, data = {}) => {
                  return (await github.request(`${method} /repos/{owner}/{repo}${route}`, { ...context.repo, ...data })).data;
                }, Number(process.env.PUBLISH_APP_BOT_ID));
              }
            }
