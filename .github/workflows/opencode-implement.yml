name: opencode-implement

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source issue number
        required: true
        type: string
      comment:
        description: Explicit approving human comment ID
        required: true
        type: string
      approval_digest:
        description: SHA-256 of the JSON encoded original human comment body
        required: true
        type: string

permissions: {}

concurrency:
  group: initial-source-${{ inputs.source }}
  cancel-in-progress: false
  queue: max

jobs:
  source:
    name: initial-source-${{ inputs.source }}
    if: >-
      vars.IMPLEMENTATION_INITIAL_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.actor == 'MeNn13' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo 'Initial implementation request'

  context:
    name: implementation-context
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      sha: ${{ steps.base.outputs.sha }}
      spec: ${{ steps.context.outputs.spec }}
    steps:
      - name: Configure runtime paths
        run: |
          printf '%s\n' "INITIAL_IO=$RUNNER_TEMP/initial" "INITIAL_CANDIDATE_ROOT=$RUNNER_TEMP/candidate" "PUBLISH_IO=$RUNNER_TEMP/initial" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bind explicit human approval and native graph
        id: context
        run: node scripts/implementation-initial.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ steps.base.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: implementation-context
          path: ${{ runner.temp }}/initial/context.json
          retention-days: 7
      - name: Record admission failure
        if: failure()
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/initial"
          printf '{"stage":"context","category":"admission_failed","base":"%s","sha":null}\n' "$BASE_SHA" > "$RUNNER_TEMP/initial/diagnostic.json"
          cat "$RUNNER_TEMP/initial/diagnostic.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: initial-context-diagnostic
          path: ${{ runner.temp }}/initial/diagnostic.json
          retention-days: 7

  check:
    name: implementation-check
    needs: [context]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Configure runtime paths
        run: |
          printf '%s\n' "INITIAL_IO=$RUNNER_TEMP/initial" "INITIAL_CANDIDATE_ROOT=$RUNNER_TEMP/candidate" "PUBLISH_IO=$RUNNER_TEMP/initial" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: implementation-context
          path: ${{ runner.temp }}/initial
      - name: Install pinned toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      - name: Prepare isolated candidate worktree
        shell: bash
        run: |
          head=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.INITIAL_IO+"/context.json")).expectedHead')
          git worktree add --detach "$INITIAL_CANDIDATE_ROOT" "$head"
          mise trust "$INITIAL_CANDIDATE_ROOT/mise.toml"
          cd "$INITIAL_CANDIDATE_ROOT"
          mise run install
          mise exec -- npx playwright install --with-deps --only-shell chromium
      - name: Install pinned OpenCode and isolation
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/install-implementation-sandbox.sh"
          curl --fail --silent --show-error --location https://github.com/anomalyco/opencode/releases/download/v2.2.3/opencode-linux-x64.tar.gz --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "ef3aeeaf5522b10d69a3da7bbd6e6d8d259f845833d96b8310767d3407b18a35  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
      - name: Implement entire specification and verify exact commit
        id: graph
        continue-on-error: true
        run: node scripts/implementation-graph.mjs
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode-bin/opencode
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      - name: initial-timeout
        if: steps.graph.outputs.reason == 'timeout'
        run: echo 'Initial deadline reached'
      - name: Record failure diagnostic
        if: failure() || steps.graph.outcome == 'failure'
        env:
          BASE_SHA: ${{ needs.context.outputs.sha }}
        run: |
          if [[ ! -f "$INITIAL_IO/diagnostic.json" ]]; then
            mkdir -p "$INITIAL_IO"
            printf '{"stage":"setup","category":"setup_failed","base":"%s","sha":null}\n' "$BASE_SHA" > "$INITIAL_IO/diagnostic.json"
            cat "$INITIAL_IO/diagnostic.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() || steps.graph.outcome == 'failure'
        with:
          name: initial-check-diagnostic
          path: ${{ runner.temp }}/initial/diagnostic.json
          retention-days: 7
      - name: Reject unsuccessful implementation
        if: steps.graph.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: implementation-result
          path: ${{ runner.temp }}/initial/result.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: implementation-verification
          path: ${{ runner.temp }}/initial/verification.json
          retention-days: 7

  publish:
    name: initial-publish-spec-${{ needs.context.outputs.spec }}
    needs: [context, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: implementation-publisher
    permissions:
      contents: read
      actions: read
    steps:
      - name: Configure runtime paths
        run: |
          printf '%s\n' "INITIAL_IO=$RUNNER_TEMP/initial" "INITIAL_CANDIDATE_ROOT=$RUNNER_TEMP/candidate" "PUBLISH_IO=$RUNNER_TEMP/initial" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: implementation-context
          path: ${{ runner.temp }}/initial/context
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: implementation-result
          path: ${{ runner.temp }}/initial/result
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: implementation-verification
          path: ${{ runner.temp }}/initial/verification
      - name: Mint repository-scoped installation token
        id: installation
        run: node scripts/implementation-app.mjs
        env:
          PUBLISH_APP_ID: ${{ vars.PUBLISH_APP_ID }}
          PUBLISH_INSTALLATION_ID: ${{ vars.PUBLISH_INSTALLATION_ID }}
          PUBLISH_APP_PRIVATE_KEY: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
      - name: Publish verified specification with trusted App operations
        run: node scripts/implementation-publish.mjs
        env:
          TRUSTED_SHA: ${{ needs.context.outputs.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          PUBLISH_APP_BOT_ID: ${{ vars.PUBLISH_APP_BOT_ID }}
      - name: Revoke installation token
        if: always() && steps.installation.outcome == 'success'
        run: node scripts/implementation-app.mjs revoke
      - name: Record publication failure
        if: failure()
        env:
          BASE_SHA: ${{ needs.context.outputs.sha }}
        run: |
          if [[ ! -f "$PUBLISH_IO/publish-diagnostic.json" ]]; then
            mkdir -p "$PUBLISH_IO"
            printf '{"stage":"publish","category":"setup_failed","base":"%s","sha":null}\n' "$BASE_SHA" > "$PUBLISH_IO/publish-diagnostic.json"
            cat "$PUBLISH_IO/publish-diagnostic.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: initial-publish-diagnostic
          path: ${{ runner.temp }}/initial/publish-diagnostic.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          overwrite: true
          name: implementation-publication
          path: ${{ runner.temp }}/initial/publication.json
          if-no-files-found: ignore
          retention-days: 7
