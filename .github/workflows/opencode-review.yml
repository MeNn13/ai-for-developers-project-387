name: independent-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'MeNn13' ||
       (vars.REVIEW_APP_LOGIN != '' && github.event.pull_request.user.login == vars.REVIEW_APP_LOGIN &&
        format('{0}', github.event.pull_request.user.id) == vars.REVIEW_APP_ID))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      allowed: ${{ steps.context.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Collect independent review grounds
        id: context
        run: node scripts/opencode-review.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_IO: ${{ runner.temp }}/review
          REVIEW_APP_LOGIN: ${{ vars.REVIEW_APP_LOGIN }}
          REVIEW_APP_ID: ${{ vars.REVIEW_APP_ID }}
      - name: Install pinned OpenCode CLI
        if: steps.context.outputs.allowed == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/anomalyco/opencode/releases/download/v2.2.3/opencode-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "ef3aeeaf5522b10d69a3da7bbd6e6d8d259f845833d96b8310767d3407b18a35  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
          sudo mkdir -p /etc/opencode
          # The trusted base may predate submit_reply while this PR changes the workflow.
          if [ -f scripts/opencode-config.mjs ]; then
            node scripts/opencode-config.mjs
          else
            jq '.update = "disable"' .github/opencode/opencode.json
          fi | sudo tee /etc/opencode/opencode.json > /dev/null
      - name: Run independent review
        if: steps.context.outputs.allowed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { run } from './scripts/opencode.mjs';
          import { diagnosticFor } from './scripts/opencode-diagnostic.mjs';
          const directory = process.env.OPENCODE_IO;
          const publication = join(directory, 'publication');
          try {
            await mkdir(publication, { recursive: true });
            await run(directory, {
              prompt: '.github/opencode/review-prompt.txt',
              title: 'Independent PR review',
            });
            const { mode, repository, number, head } =
              JSON.parse(await readFile(join(directory, 'context.json'), 'utf8'));
            const reply = JSON.parse(await readFile(join(directory, 'reply.json'), 'utf8'));
            // The trusted base may predate the review-specific checks.
            if (reply.publication !== null || reply.comment.includes(process.env.OPENCODE_API_KEY))
              throw new Error('Review reply is not publishable.');
            await writeFile(join(publication, 'context.json'), JSON.stringify({ mode, repository, number, head }));
            await writeFile(join(publication, 'reply.json'), JSON.stringify({
              version: reply.version, comment: reply.comment, publication: null,
            }));
          } catch (error) {
            const diagnostic = diagnosticFor(error);
            console.error(JSON.stringify(diagnostic));
            try {
              await writeFile(join(publication, 'diagnostic.json'), JSON.stringify(diagnostic));
            } catch {
              console.error('Could not save safe review diagnostic.');
            }
            process.exitCode = 1;
          }
          NODE
        env:
          OPENCODE_IO: ${{ runner.temp }}/review
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && !cancelled() && steps.context.outputs.allowed == 'true'
        with:
          name: independent-review
          path: ${{ runner.temp }}/review/publication/*.json
          retention-days: 1

  publish:
    needs: review
    if: needs.review.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: independent-review
          path: ${{ runner.temp }}/review
      - name: Publish review without model
        run: node scripts/opencode-review.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_IO: ${{ runner.temp }}/review
          REVIEW_APP_LOGIN: ${{ vars.REVIEW_APP_LOGIN }}
          REVIEW_APP_ID: ${{ vars.REVIEW_APP_ID }}
