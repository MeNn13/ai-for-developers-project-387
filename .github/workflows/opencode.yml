name: opencode

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  # Only reruns of this comment compete here. Admitted requests compete below.
  group: opencode-${{ github.event_name }}-${{ github.event.comment.id || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  context:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.type == 'User' &&
       github.event.issue.user.login == 'MeNn13' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name != 'issues' && github.event.comment.user.type == 'User' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.context.outputs.allowed }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record default branch revision
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check author and collect discussion
        id: context
        run: node scripts/opencode.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_IO: ${{ runner.temp }}/opencode-context
          CHECKOUT_SHA: ${{ steps.commit.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.context.outputs.allowed == 'true'
        with:
          name: opencode-context
          path: ${{ runner.temp }}/opencode-context/context.json
          retention-days: 1

  answer:
    needs: context
    if: needs.context.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: opencode-answer-${{ github.event_name == 'issues' && 'triage' || 'manual' }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-context
          path: ${{ runner.temp }}/opencode-io
      - name: Install pinned OpenCode CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/anomalyco/opencode/releases/download/v2.2.3/opencode-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "ef3aeeaf5522b10d69a3da7bbd6e6d8d259f845833d96b8310767d3407b18a35  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
          sudo mkdir -p /etc/opencode
          jq '.update = "disable"' .github/opencode/opencode.json | sudo tee /etc/opencode/opencode.json > /dev/null
      - name: Prepare discussion or publication
        run: node scripts/opencode.mjs run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_IO: ${{ runner.temp }}/opencode-io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-reply
          path: ${{ runner.temp }}/opencode-io/reply.json
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && !cancelled()
        with:
          name: opencode-diagnostic
          path: ${{ runner.temp }}/opencode-io/diagnostic.json
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [context, answer]
    if: always() && github.event_name != 'issues' && needs.context.outputs.allowed == 'true' && needs.answer.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: opencode-publish-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-context
          path: ${{ runner.temp }}/opencode-context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.answer.result == 'success'
        with:
          name: opencode-reply
          path: ${{ runner.temp }}/opencode-reply
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.answer.result == 'failure'
        continue-on-error: true
        with:
          name: opencode-diagnostic
          path: ${{ runner.temp }}/opencode-diagnostic
      - name: Publish answer or failure notice
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANSWER_RESULT: ${{ needs.answer.result }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue_number = context.payload.issue?.number ?? context.payload.pull_request.number;
            const { pathToFileURL } = require('node:url');
            const { failureNotice, diagnosticFor, DiagnosticError } = await import(pathToFileURL(path.resolve('scripts/opencode-diagnostic.mjs')).href);
            const readArtifact = async (directory, name) => {
              try { return JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, directory, name), 'utf8')); }
              catch { throw new DiagnosticError('publication', { reason: 'artifact_read', state: 'unknown' }); }
            };
            try {
              if (process.env.ANSWER_RESULT !== 'success') throw new Error('Model job failed');
              const prepared = await readArtifact('opencode-context', 'context.json');
              const automatic = context.eventName === 'issues';
              const requestId = automatic ? context.payload.issue.id : context.payload.comment.id;
              if (prepared.number !== issue_number || prepared.requestId !== requestId ||
                  (prepared.mode === 'triage') !== automatic ||
                  prepared.repository !== `${context.repo.owner}/${context.repo.repo}`) throw new DiagnosticError('publication', { reason: 'workflow_context', state: 'unknown' });
              const reply = await readArtifact('opencode-reply', 'reply.json');
              const { publish } = await import(pathToFileURL(path.resolve('scripts/opencode-publish.mjs')).href);
              const api = async (method, route, data = {}) => {
                const response = await github.request(`${method} /repos/{owner}/{repo}${route}`, { ...context.repo, ...data });
                return response.data;
              };
              await publish(reply, prepared, api, run);
            } catch (error) {
              let diagnostic = diagnosticFor(error);
              if (process.env.ANSWER_RESULT !== 'success') {
                try {
                  const file = path.join(process.env.RUNNER_TEMP, 'opencode-diagnostic', 'diagnostic.json');
                  if ((await fs.stat(file)).size <= 1024) diagnostic = JSON.parse(await fs.readFile(file, 'utf8'));
                } catch {}
              }
              await github.rest.issues.createComment({ ...context.repo, issue_number,
                body: failureNotice(diagnostic, run, process.env.ANSWER_RESULT !== 'success') });
              core.setFailed('OpenCode preparation or publication failed.');
            }

  publish-triage:
    needs: [context, answer]
    if: always() && github.event_name == 'issues' && needs.context.outputs.allowed == 'true' && needs.answer.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: opencode-triage-publish-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-context
          path: ${{ runner.temp }}/opencode-context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.answer.result == 'success'
        with:
          name: opencode-reply
          path: ${{ runner.temp }}/opencode-reply
      - name: Publish preliminary triage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANSWER_RESULT: ${{ needs.answer.result }}
        with:
          script: |
            if (process.env.ANSWER_RESULT !== 'success') {
              core.setFailed('Automatic triage failed. See answer job diagnostics. Retry failed jobs for transient failures; after code fixes, create a new issue after merge.');
              return;
            }
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const prepared = JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, 'opencode-context', 'context.json'), 'utf8'));
            if (prepared.mode !== 'triage' || prepared.number !== context.payload.issue.number ||
                prepared.requestId !== context.payload.issue.id ||
                prepared.repository !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('Context mismatch');
            const reply = JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, 'opencode-reply', 'reply.json'), 'utf8'));
            const { publish } = await import(pathToFileURL(path.resolve('scripts/opencode-publish.mjs')).href);
            await publish(reply, prepared, async (method, route, data = {}) => {
              const response = await github.request(`${method} /repos/{owner}/{repo}${route}`, { ...context.repo, ...data });
              return response.data;
            }, `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
