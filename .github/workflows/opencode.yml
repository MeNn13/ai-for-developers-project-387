name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  # Only reruns of this comment compete here. Admitted requests compete below.
  group: opencode-comment-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  context:
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.context.outputs.allowed }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record default branch revision
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check author and collect discussion
        id: context
        run: node scripts/opencode.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_IO: ${{ runner.temp }}/opencode-context
          CHECKOUT_SHA: ${{ steps.commit.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.context.outputs.allowed == 'true'
        with:
          name: opencode-context
          path: ${{ runner.temp }}/opencode-context/context.json
          retention-days: 1

  answer:
    needs: context
    if: needs.context.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-context
          path: ${{ runner.temp }}/opencode-io
      - name: Install pinned OpenCode CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/anomalyco/opencode/releases/download/v2.2.3/opencode-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "ef3aeeaf5522b10d69a3da7bbd6e6d8d259f845833d96b8310767d3407b18a35  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
          sudo mkdir -p /etc/opencode
          jq '.update = "disable"' .github/opencode/opencode.json | sudo tee /etc/opencode/opencode.json > /dev/null
      - name: Explain discussion
        run: node scripts/opencode.mjs run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_IO: ${{ runner.temp }}/opencode-io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-reply
          path: ${{ runner.temp }}/opencode-io/reply.json
          retention-days: 1

  publish:
    needs: [context, answer]
    if: always() && needs.context.outputs.allowed == 'true' && needs.answer.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.answer.result == 'success'
        with:
          name: opencode-reply
          path: ${{ runner.temp }}/opencode-reply
      - name: Publish answer or failure notice
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ANSWER_RESULT: ${{ needs.answer.result }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const replies = process.env.ANSWER_RESULT === 'success'
              ? JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, 'opencode-reply', 'reply.json'), 'utf8'))
              : [`OpenCode не смог подготовить ответ. Проверьте секрет OPENCODE_API_KEY, доступность бесплатной модели и лимиты провайдера. [Прогон Actions](${run})`];
            if (!Array.isArray(replies) || !replies.length || replies.length > 40 ||
                replies.some(body => typeof body !== 'string' || !body.trim() || body.length > 60000)) {
              throw new Error('Invalid OpenCode reply');
            }
            const issue_number = context.payload.issue?.number ?? context.payload.pull_request.number;
            for (const body of replies) {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
